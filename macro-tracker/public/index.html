<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f5f2; --card: #ffffff; --border: #e0e0da;
    --text: #1a1a1a; --muted: #666; --hint: #999;
    --cal: #B85C38; --prot: #185FA5; --carb: #854F0B; --fat: #3B6D11;
    --radius: 12px; --radius-sm: 8px;
  }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .page { max-width: 680px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 2px; }
  .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 1.5rem; }
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1rem; }
  .mc { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
  .mc .lbl { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .mc .val { font-size: 22px; font-weight: 500; }
  .mc .sub { font-size: 11px; color: var(--hint); margin-top: 1px; }
  .mc .bar { height: 3px; border-radius: 2px; background: var(--border); margin-top: 7px; overflow: hidden; }
  .mc .fill { height: 100%; border-radius: 2px; width: 0%; transition: width 0.5s ease; }
  .cal .val { color: var(--cal); } .cal .fill { background: var(--cal); }
  .prot .val { color: var(--prot); } .prot .fill { background: var(--prot); }
  .carb .val { color: var(--carb); } .carb .fill { background: var(--carb); }
  .fat .val { color: var(--fat); } .fat .fill { background: var(--fat); }
  .card { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .card-title { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 10px; }
  .goals-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .g-group label { font-size: 11px; color: var(--hint); display: block; margin-bottom: 3px; }
  .g-group input { width: 100%; font-size: 13px; padding: 6px 8px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); background: var(--bg); color: var(--text); }
  .g-group input:focus { outline: none; border-color: #aaa; }
  .input-row { display: flex; gap: 8px; }
  textarea { flex: 1; font-size: 14px; padding: 10px 14px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--bg); color: var(--text); resize: none; min-height: 46px; font-family: inherit; line-height: 1.5; }
  textarea::placeholder { color: var(--hint); }
  textarea:focus { outline: none; border-color: #aaa; }
  .analyze-btn { padding: 0 20px; height: 46px; background: var(--text); color: var(--card); border: none; border-radius: var(--radius); font-size: 14px; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
  .analyze-btn:hover { opacity: 0.85; }
  .analyze-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { font-size: 12px; color: var(--hint); margin-top: 7px; min-height: 18px; }
  .status.error { color: #B85C38; }
  .status.ok { color: #3B6D11; }
  .meals-list { display: flex; flex-direction: column; gap: 8px; }
  .meal-item { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 11px 14px; display: flex; align-items: center; gap: 12px; animation: slideIn 0.2s ease; }
  @keyframes slideIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
  .meal-icon { font-size: 20px; flex-shrink: 0; }
  .meal-info { flex: 1; min-width: 0; }
  .meal-name { font-size: 13px; margin-bottom: 4px; line-height: 1.3; }
  .meal-nums { display: flex; gap: 12px; flex-wrap: wrap; }
  .mn { font-size: 12px; }
  .mn span { color: var(--hint); }
  .meal-time { font-size: 11px; color: var(--hint); flex-shrink: 0; }
  .del-btn { background: none; border: none; color: var(--hint); cursor: pointer; font-size: 20px; padding: 2px 4px; flex-shrink: 0; line-height: 1; }
  .del-btn:hover { color: var(--text); }
  .empty { text-align: center; padding: 2.5rem 1rem; color: var(--hint); font-size: 13px; }
  .empty .icon { font-size: 36px; display: block; margin-bottom: 8px; opacity: 0.35; }
  .footer-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .reset-btn { background: none; border: none; font-size: 12px; color: var(--hint); cursor: pointer; text-decoration: underline; }
  .date-label { font-size: 12px; color: var(--hint); }
  @media (max-width: 480px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
    .goals-grid { grid-template-columns: repeat(2, 1fr); }
    .mc .val { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="page">
  <h1>🥗 Macro Tracker</h1>
  <p class="subtitle">Describe tu comida y la IA calcula los macros automáticamente</p>

  <div class="summary">
    <div class="mc cal"><div class="lbl">Calorías</div><div class="val" id="tc">0</div><div class="sub" id="sc">meta: 2000</div><div class="bar"><div class="fill" id="bc"></div></div></div>
    <div class="mc prot"><div class="lbl">Proteínas</div><div class="val" id="tp">0g</div><div class="sub" id="sp">meta: 150g</div><div class="bar"><div class="fill" id="bp"></div></div></div>
    <div class="mc carb"><div class="lbl">Carbos</div><div class="val" id="tk">0g</div><div class="sub" id="sk">meta: 200g</div><div class="bar"><div class="fill" id="bk"></div></div></div>
    <div class="mc fat"><div class="lbl">Grasas</div><div class="val" id="tf">0g</div><div class="sub" id="sf">meta: 65g</div><div class="bar"><div class="fill" id="bf"></div></div></div>
  </div>

  <div class="card">
    <div class="card-title">🎯 Mis metas diarias</div>
    <div class="goals-grid">
      <div class="g-group"><label>Calorías (kcal)</label><input type="number" id="gc" value="2000" oninput="refresh()"></div>
      <div class="g-group"><label>Proteínas (g)</label><input type="number" id="gp" value="150" oninput="refresh()"></div>
      <div class="g-group"><label>Carbohidratos (g)</label><input type="number" id="gk" value="200" oninput="refresh()"></div>
      <div class="g-group"><label>Grasas (g)</label><input type="number" id="gf" value="65" oninput="refresh()"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">✍️ Registrar comida</div>
    <div class="input-row">
      <textarea id="meal-input" rows="1"
        placeholder="Ej: 3 huevos revueltos con jamón, 2 tortillas de maíz y un vaso de jugo de naranja..."
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();analyze()}"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
      <button class="analyze-btn" id="btn" onclick="analyze()">✨ Analizar</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="meals-list" id="list">
    <div class="empty"><span class="icon">🍽️</span>Aún no has registrado ninguna comida hoy</div>
  </div>

  <div class="footer-row">
    <span class="date-label" id="date-label"></span>
    <button class="reset-btn" onclick="resetDay()">Reiniciar día</button>
  </div>
</div>

<script>
const ICONS = ['🍳','🥗','🌮','🍱','🥤','🍽️','🥩','🍜','🥪','🥞','🥦','🍛','🫔','🥘','🍲'];
let meals = JSON.parse(localStorage.getItem('macros_meals') || '[]');
let totals = JSON.parse(localStorage.getItem('macros_totals') || '{"c":0,"p":0,"k":0,"f":0}');

const todayStr = new Date().toDateString();
if (localStorage.getItem('macros_day') !== todayStr) {
  meals = []; totals = {c:0,p:0,k:0,f:0};
  localStorage.setItem('macros_day', todayStr);
}

const today = new Date().toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' });
document.getElementById('date-label').textContent = today.charAt(0).toUpperCase() + today.slice(1);

function goals() {
  return {
    c: parseInt(document.getElementById('gc').value)||2000,
    p: parseInt(document.getElementById('gp').value)||150,
    k: parseInt(document.getElementById('gk').value)||200,
    f: parseInt(document.getElementById('gf').value)||65
  };
}

function save() {
  localStorage.setItem('macros_meals', JSON.stringify(meals));
  localStorage.setItem('macros_totals', JSON.stringify(totals));
}

function refresh() {
  const g = goals();
  document.getElementById('tc').textContent = totals.c;
  document.getElementById('tp').textContent = totals.p + 'g';
  document.getElementById('tk').textContent = totals.k + 'g';
  document.getElementById('tf').textContent = totals.f + 'g';
  document.getElementById('sc').textContent = 'meta: ' + g.c;
  document.getElementById('sp').textContent = 'meta: ' + g.p + 'g';
  document.getElementById('sk').textContent = 'meta: ' + g.k + 'g';
  document.getElementById('sf').textContent = 'meta: ' + g.f + 'g';
  [['c','bc'],['p','bp'],['k','bk'],['f','bf']].forEach(([k,id]) => {
    const pct = g[k] > 0 ? Math.min(100, Math.round(totals[k] / g[k] * 100)) : 0;
    document.getElementById(id).style.width = pct + '%';
  });
  const list = document.getElementById('list');
  if (!meals.length) {
    list.innerHTML = '<div class="empty"><span class="icon">🍽️</span>Aún no has registrado ninguna comida hoy</div>';
    return;
  }
  list.innerHTML = [...meals].reverse().map(m => `
    <div class="meal-item">
      <div class="meal-icon">${m.icon}</div>
      <div class="meal-info">
        <div class="meal-name">${m.name}</div>
        <div class="meal-nums">
          <div class="mn"><strong>${m.c}</strong> <span>kcal</span></div>
          <div class="mn"><strong>${m.p}g</strong> <span>prot</span></div>
          <div class="mn"><strong>${m.k}g</strong> <span>carbs</span></div>
          <div class="mn"><strong>${m.f}g</strong> <span>grasas</span></div>
        </div>
      </div>
      <div class="meal-time">${m.time}</div>
      <button class="del-btn" onclick="del(${m.id})">×</button>
    </div>`).join('');
}

async function analyze() {
  const input = document.getElementById('meal-input');
  const desc = input.value.trim();
  if (!desc) { input.focus(); return; }
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.className = 'status';
  status.textContent = '⏳ Analizando con IA...';
  try {
    const res = await fetch('/.netlify/functions/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: desc })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error del servidor');
    const meal = {
      id: Date.now(),
      name: data.summary || desc,
      c: Math.round(data.calories || 0),
      p: Math.round(data.protein || 0),
      k: Math.round(data.carbs || 0),
      f: Math.round(data.fat || 0),
      icon: ICONS[Math.floor(Math.random() * ICONS.length)],
      time: new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })
    };
    meals.push(meal);
    totals.c += meal.c; totals.p += meal.p; totals.k += meal.k; totals.f += meal.f;
    save();
    input.value = '';
    input.style.height = 'auto';
    status.className = 'status ok';
    status.textContent = '✓ ' + meal.c + ' kcal · ' + meal.p + 'g prot · ' + meal.k + 'g carbs · ' + meal.f + 'g grasas';
    refresh();
  } catch(e) {
    status.className = 'status error';
    status.textContent = '✗ ' + (e.message || 'Error, intenta de nuevo');
  }
  btn.disabled = false;
}

function del(id) {
  const m = meals.find(x => x.id === id);
  if (!m) return;
  totals.c -= m.c; totals.p -= m.p; totals.k -= m.k; totals.f -= m.f;
  meals = meals.filter(x => x.id !== id);
  save(); refresh();
}

function resetDay() {
  if (!confirm('¿Reiniciar el día?')) return;
  meals = []; totals = {c:0,p:0,k:0,f:0};
  save(); refresh();
}

refresh();
</script>
</body>
</html>
